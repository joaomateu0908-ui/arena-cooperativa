<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arena Cooperativa</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0a0e17;color-scheme:dark;overflow:hidden;font-family:system-ui,sans-serif;color:#eee;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
  #c{position:absolute;inset:0;width:100%;height:100%}
  #ui{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000;pointer-events:none}
  #ui span{background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px;margin-right:6px;display:inline-block;margin-bottom:4px}
  #players{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;font-size:13px;text-align:right;pointer-events:none}
  #players .row{background:rgba(0,0,0,.4);padding:3px 10px;border-radius:8px;margin-bottom:4px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  #stick{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25)}
  #knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(120,180,255,.55);left:34px;top:34px;pointer-events:none}
  #shootBtn{position:fixed;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:rgba(255,90,90,.35);border:2px solid rgba(255,150,150,.55);display:flex;align-items:center;justify-content:center;font-size:30px}
  #shootBtn.active{background:rgba(255,90,90,.65)}
  #inviteBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 16px;border-radius:20px;background:rgba(56,214,122,.25);border:1px solid rgba(56,214,122,.6);font-size:13px;font-weight:600}
  #overlay{position:fixed;inset:0;background:rgba(5,8,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:10;touch-action:auto}
  #overlay h1{margin:0;font-size:22px}
  #overlay p{margin:0;opacity:.8;max-width:290px;font-size:14px}
  #overlay input{padding:12px 14px;border-radius:10px;border:none;font-size:16px;width:230px;text-align:center;user-select:text;-webkit-user-select:text}
  #overlay button,#overlay a.btn{padding:12px 24px;border-radius:10px;border:none;background:#4f8cff;color:#fff;font-size:16px;font-weight:700;text-decoration:none;display:inline-block;width:230px}
  .hidden{display:none!important}

#invite{display:flex}#invite[hidden]{display:none!important}
</style>

<canvas id="c"></canvas>
<div id="ui"><span id="hp">HP: 100</span><span id="score">Acertos: 0</span></div>
<div id="players"></div>
<div id="stick"><div id="knob"></div></div>
<div id="shootBtn">🔫</div>
<div id="inviteBtn" hidden>🔗 Chamar amigo</div>

<div id="overlay">
  <h1 id="ovTitle">Como quer ser chamado?</h1>
  <p id="ovText">Entre e depois chame seus amigos pelo WhatsApp ou Instagram.</p>
  <input id="nameInput" maxlength="14" placeholder="Seu nome" autocomplete="off">
  <button id="nameBtn">Entrar na arena</button>
</div>

<div id="invite" hidden style="position:fixed;inset:0;z-index:20;background:rgba(5,8,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;touch-action:auto">
  <h1 style="margin:0;font-size:22px">Chamar amigos</h1>
  <p style="margin:0;opacity:.8;font-size:14px;max-width:290px">Quem abrir o link entra na arena. Pro Instagram, copie o link e cole na conversa.</p>
  <a id="waBtn" class="btn" style="background:#25d366;padding:12px 24px;border-radius:10px;color:#fff;font-size:16px;font-weight:700;text-decoration:none;width:230px" target="_blank" rel="noopener">WhatsApp</a>
    <button id="copyBtn" style="padding:12px 24px;border-radius:10px;border:none;background:#2c3a55;color:#fff;font-size:16px;font-weight:700;width:230px">Copiar link</button>
  <p id="shareMsg" style="font-size:12px;opacity:.8;min-height:16px;word-break:break-all"></p>
  <button id="closeInvite" style="padding:10px 24px;border-radius:10px;border:none;background:transparent;color:#aaa;font-size:15px">Voltar ao jogo</button>
</div>

<script>
const SHARE_URL='https://claude.ai/artifact/6kcoLKBwc9kxcUbiMYenja';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

const W=1400,H=900;
const OBSTACLES=[
  {x:150,y:150,w:180,h:40},{x:150,y:710,w:180,h:40},
  {x:1070,y:150,w:180,h:40},{x:1070,y:710,w:180,h:40},
  {x:610,y:80,w:40,h:220},{x:750,y:600,w:40,h:220},
  {x:400,y:430,w:220,h:40},{x:780,y:430,w:220,h:40},
  {x:660,y:440,w:80,h:80}
];
function isBlocked(x,y,r){
  if(x<r||x>W-r||y<r||y>H-r)return true;
  for(const o of OBSTACLES){
    const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));
    if(Math.hypot(x-cx,y-cy)<r)return true;
  }
  return false;
}
function randomSpawn(){
  for(let i=0;i<60;i++){const x=40+Math.random()*(W-80),y=40+Math.random()*(H-80);if(!isBlocked(x,y,20))return{x,y}}
  return{x:W/2,y:H/2};
}

const myId=Math.random().toString(36).slice(2,10);
const joinTime=Date.now();
let myName='Jogador';
let myPos=randomSpawn();
let stickVec={x:0,y:0},lastDir={x:0,y:-1};
const SPEED=190;

const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let dragId=null,center={x:0,y:0};
function stickStart(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=stick.getBoundingClientRect();center={x:r.left+r.width/2,y:r.top+r.height/2};dragId=t.identifier??'mouse';move(t)}
function move(t){const dx=t.clientX-center.x,dy=t.clientY-center.y;const d=Math.hypot(dx,dy)||1;const cl=Math.min(d,44);knob.style.left=34+dx/d*cl+'px';knob.style.top=34+dy/d*cl+'px';stickVec={x:dx/d*Math.min(d/44,1),y:dy/d*Math.min(d/44,1)}}
function stickEnd(){dragId=null;stickVec={x:0,y:0};knob.style.left='34px';knob.style.top='34px'}
function findTouch(e){for(const t of e.touches)if(t.identifier===dragId)return t;return null}
stick.addEventListener('touchstart',e=>{e.preventDefault();stickStart(e)},{passive:false});
stick.addEventListener('touchmove',e=>{e.preventDefault();const t=findTouch(e);if(t)move(t)},{passive:false});
stick.addEventListener('touchend',e=>{e.preventDefault();if(!findTouch(e))stickEnd()},{passive:false});
stick.addEventListener('touchcancel',()=>stickEnd());
stick.addEventListener('mousedown',e=>stickStart(e));
addEventListener('mousemove',e=>{if(dragId==='mouse')move(e)});
addEventListener('mouseup',()=>{if(dragId==='mouse')stickEnd()});

const keys={};
let shootHeld=false,lastShot=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')shootHeld=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')shootHeld=false});
function keyVec(){
  const x=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  const y=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  const m=Math.hypot(x,y);return m?{x:x/m,y:y/m}:null;
}

const shootBtn=document.getElementById('shootBtn');
const SHOOT_COOLDOWN=0.28;
function shootDown(e){e.preventDefault();shootHeld=true;shootBtn.classList.add('active');fireBullet()}
function shootUp(e){e&&e.preventDefault();shootHeld=false;shootBtn.classList.remove('active')}
shootBtn.addEventListener('touchstart',shootDown,{passive:false});
shootBtn.addEventListener('touchend',shootUp,{passive:false});
shootBtn.addEventListener('touchcancel',shootUp);
shootBtn.addEventListener('mousedown',shootDown);
addEventListener('mouseup',()=>shootUp());

let room=null,worldState=null,isHost=true;
let localPlayers={},localBullets=[];
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText');
try{const n=localStorage.getItem('arena_nome');if(n)document.getElementById('nameInput').value=n}catch(e){}

const inviteBox=document.getElementById('invite');
const shareText='Vem jogar Arena comigo! 🔫 Toca no link:';
document.getElementById('inviteBtn').onclick=()=>{
  document.getElementById('waBtn').href='https://wa.me/?text='+encodeURIComponent(shareText+' '+SHARE_URL);
  document.getElementById('shareMsg').textContent='';
  inviteBox.hidden=false;
};
document.getElementById('closeInvite').onclick=()=>{inviteBox.hidden=true};
document.getElementById('copyBtn').onclick=async()=>{
  const msg=document.getElementById('shareMsg');
  try{await navigator.clipboard.writeText(SHARE_URL);msg.textContent='Link copiado! Cola no Instagram, Zap, onde quiser.'}
  catch(e){msg.textContent=SHARE_URL}
};

document.getElementById('nameBtn').onclick=()=>{
  const v=document.getElementById('nameInput').value.trim();
  if(v)myName=v.slice(0,14);
  try{localStorage.setItem('arena_nome',myName)}catch(e){}
  document.getElementById('nameInput').classList.add('hidden');
  document.getElementById('nameBtn').classList.add('hidden');
  ovTitle.textContent='Conectando...';ovText.textContent='Já já você entra na arena.';
  initRoom();
};

function combinedPeers(peers){
  const arr=(peers||[]).map(p=>p.presence||p).filter(p=>p&&p.id);
  const byId={};arr.forEach(p=>byId[p.id]=p);
  byId[myId]={id:myId,t:joinTime,x:myPos.x,y:myPos.y,name:myName};
  return Object.values(byId);
}

async function initRoom(){
  room=await claude.use('room');
  if(!room){
    ovTitle.textContent='Sem conexão';
    ovText.textContent='Não deu pra abrir a sala multijogador. Recarregue a página.';
    return;
  }
  room.onPeers(peers=>{
    const all=combinedPeers(peers);
    const host=all.reduce((a,b)=>(b.t<a.t?b:a),all[0]);
    isHost=host.id===myId;
    window.__peers=all;
  });
  room.on('world',data=>{if(!isHost)worldState=data});
  room.on('shoot',data=>{if(isHost)hostSpawnBullet(data)});
  setInterval(()=>{room.presence({id:myId,t:joinTime,x:myPos.x,y:myPos.y,name:myName})},120);
  overlay.classList.add('hidden');
  document.getElementById('inviteBtn').hidden=false;
}

const BULLET_SPEED=460,BULLET_DMG=14,BULLET_LIFE=1.1,REGEN=4;
function fireBullet(){
  const now=performance.now()/1000;
  if(now-lastShot<SHOOT_COOLDOWN)return;
  lastShot=now;
  const data={ownerId:myId,x:myPos.x,y:myPos.y,dx:lastDir.x,dy:lastDir.y};
  if(isHost)hostSpawnBullet(data);else if(room)room.emit('shoot',data);
}
function hostSpawnBullet(data){
  localBullets.push({x:data.x,y:data.y,vx:data.dx*BULLET_SPEED,vy:data.dy*BULLET_SPEED,owner:data.ownerId,t:0});
}
function colorFor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return 'hsl('+h+',70%,60%)'}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  const kv=keyVec(),sv=kv||stickVec;
  const nx=myPos.x+sv.x*SPEED*dt,ny=myPos.y+sv.y*SPEED*dt;
  if(!isBlocked(nx,myPos.y,14))myPos.x=nx;
  if(!isBlocked(myPos.x,ny,14))myPos.y=ny;
  const mag=Math.hypot(sv.x,sv.y);
  if(mag>0.25)lastDir={x:sv.x/mag,y:sv.y/mag};
  if(shootHeld&&room)fireBullet();

  const peers=window.__peers||[{id:myId,x:myPos.x,y:myPos.y,t:joinTime,name:myName}];
  peers.forEach(p=>{if(p.id===myId){p.x=myPos.x;p.y=myPos.y}});

  if(isHost&&room){
    peers.forEach(p=>{if(!(p.id in localPlayers))localPlayers[p.id]={hp:100,hits:0}});
    localBullets.forEach(b=>{
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.t+=dt;
      if(b.hit)return;
      if(isBlocked(b.x,b.y,4)){b.hit=true;return}
      for(const p of peers){
        if(p.id===b.owner)continue;
        const lp=localPlayers[p.id];if(!lp)continue;
        if(Math.hypot(p.x-b.x,p.y-b.y)<20){
          lp.hp=Math.max(20,lp.hp-BULLET_DMG);
          const s=localPlayers[b.owner];if(s)s.hits=(s.hits||0)+1;
          b.hit=true;break;
        }
      }
    });
    localBullets=localBullets.filter(b=>!b.hit&&b.t<BULLET_LIFE);
    Object.values(localPlayers).forEach(lp=>{lp.hp=Math.min(100,lp.hp+REGEN*dt)});
    worldState={players:localPlayers,bullets:localBullets};
    room.emit('world',worldState);
  }
  render(peers);
  requestAnimationFrame(loop);
}

function render(peers){
  const ws=worldState||{players:localPlayers,bullets:localBullets};
  const VIEW_W=640,VIEW_H=420;
  const scale=Math.min(canvas.width/VIEW_W,canvas.height/VIEW_H);
  const camX=Math.max(VIEW_W/2,Math.min(myPos.x,W-VIEW_W/2));
  const camY=Math.max(VIEW_H/2,Math.min(myPos.y,H-VIEW_H/2));
  ctx.fillStyle='#0a0e17';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2-camX*scale,canvas.height/2-camY*scale);
  ctx.scale(scale,scale);
  ctx.strokeStyle='#1c2740';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
  ctx.lineWidth=1;
  for(let i=0;i<W;i+=80){ctx.strokeStyle='#111a2c';ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let j=0;j<H;j+=80){ctx.strokeStyle='#111a2c';ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke()}
  ctx.fillStyle='#2c3a55';OBSTACLES.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
  peers.forEach(p=>{
    const hp=ws.players?.[p.id]?.hp??100,mine=p.id===myId;
    ctx.fillStyle=mine?'#4f8cff':colorFor(p.id);
    ctx.beginPath();ctx.arc(p.x,p.y,16,0,7);ctx.fill();
    ctx.fillStyle='#000';ctx.fillRect(p.x-16,p.y-30,32,4);
    ctx.fillStyle=mine?'#8ab6ff':'#7dffb0';ctx.fillRect(p.x-16,p.y-30,32*Math.max(0,hp)/100,4);
    ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';
    ctx.fillText(p.name||'Jogador',p.x,p.y-36);
  });
  (ws.bullets||[]).forEach(b=>{
    ctx.fillStyle=b.owner===myId?'#ffe066':'#ffb066';
    ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();
  });
  ctx.restore();
  document.getElementById('hp').textContent='HP: '+Math.round(ws.players?.[myId]?.hp??100);
  document.getElementById('score').textContent='Acertos: '+(ws.players?.[myId]?.hits??0);
  document.getElementById('players').innerHTML=peers.map(p=>{
    const nm=((p.name||'Jogador')+(p.id===myId?' (você)':'')).replace(/</g,'&lt;');
    return '<div class="row"><span class="dot" style="background:'+(p.id===myId?'#4f8cff':colorFor(p.id))+'"></span>'+nm+'</div>';
  }).join('');
}
requestAnimationFrame(loop);
</script>

</body></html>
